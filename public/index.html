<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hornada — Quiero cocinar</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header>
    <h1>Hornada.</h1>
    <p class="tagline">El pan de tu barrio, saliendo del horno.</p>
  </header>

  <main>
    <section class="card" aria-labelledby="titulo-cocinar">
      <h2 id="titulo-cocinar">Quiero cocinar.</h2>
      <p>Tu horno ya está caliente: regístrate para que los vecinos de tu sector te encuentren.</p>

      <form id="form-cocinero">
        <label for="nombre">Nombre: tu nombre de cocinero.</label>
        <input id="campo-nombre" name="nombre" type="text" autocomplete="name" placeholder="Lupe, el del pan de masa madre">

        <label for="campo-sector">Sector: el barrio donde horneas.</label>
        <input id="campo-sector" name="sector" type="text" placeholder="Chicureo – Piedra Roja">

        <label for="campo-referencia-retiro">Referencia de retiro: dónde y cuándo te buscan el pan.</label>
        <input id="campo-referencia-retiro" name="referencia_retiro" type="text" placeholder="Portón gris Calle 1, s/f y s/b, 8:00 a 20:00">

        <label for="campo-foto-url">Foto (opcional): una imagen de tus piezas.</label>
        <input id="campo-foto-url" name="foto_url" type="url" placeholder="https://...">

        <button type="submit">Registrarme como cocinero</button>
      </form>

      <p id="mensaje-cocinero" class="mensaje" role="status"></p>
    </section>

    <section class="card" aria-labelledby="titulo-hornada">
      <h2 id="titulo-hornada">Mi hornada.</h2>
      <p>Publica lo que vas a hornear: qué pan, cuándo sale, cuántas unidades y a cuánto. Los vecinos reservan antes de que se enfríe.</p>

      <form id="form-hornada">
        <label for="campo-pan">Pan: qué estás horneando.</label>
        <input id="campo-pan" name="pan" type="text" placeholder="Marraquetas de masa madre">

        <label for="campo-desde">Desde: cuándo lo sacas del horno.</label>
        <input id="campo-desde" name="desde" type="datetime-local">

        <label for="campo-hasta">Hasta: hasta cuándo se puede retirar.</label>
        <input id="campo-hasta" name="hasta" type="datetime-local">

        <label for="campo-unidades">Unidades: cuántas salen en total.</label>
        <input id="campo-unidades" name="unidades" type="number" min="1" step="1" placeholder="30">

        <label for="campo-precio">Precio: pesos chilenos por unidad, entero.</label>
        <input id="campo-precio" name="precio" type="number" min="1" step="1" placeholder="1500">

        <label>Modalidades: cómo se entrega.</label>
        <div class="opciones">
          <span class="opcion">
            <input id="campo-modalidades-retiro" name="modalidades" type="checkbox" value="retiro">
            <label for="campo-modalidades-retiro" class="inline">Retiro en la referencia</label>
          </span>
          <span class="opcion">
            <input id="campo-modalidades-despacho" name="modalidades" type="checkbox" value="despacho">
            <label for="campo-modalidades-despacho" class="inline">Despacho en el barrio</label>
          </span>
        </div>

        <label for="campo-referencia-hornada">Referencia de retiro: dónde y cuándo te buscan el pan.</label>
        <input id="campo-referencia-hornada" name="referencia_retiro" type="text" placeholder="Portón gris Calle 1, s/f y s/b, 8:00 a 20:00">

        <button type="submit">Publicar mi hornada</button>
      </form>

      <p id="mensaje-hornada" class="mensaje" role="status"></p>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
